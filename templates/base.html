<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="view-transition" content="same-origin">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}?v=ui-unify-20260925-9">
    <title>{% block title %}GPT发卡网{% endblock %}</title>
    <script>
      try {
        if (sessionStorage.removeItem("portal-cross-navigation")) {
          document.documentElement.classList.add("portal-transition-arrival");
        }
        if (sessionStorage.removeItem("admin-cross-navigation")) {
          document.documentElement.classList.add("admin-transition-arrival");
        }
      } catch (_) {}
      document.addEventListener("DOMContentLoaded", function () {
        var token = document.querySelector('meta[name="csrf-token"]');
        if (!token) return;
        document.querySelectorAll('form[method="post"], form[method="POST"]').forEach(function (form) {
          if (form.querySelector('input[name="csrf_token"]')) return;
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = "csrf_token";
          input.value = token.content;
          form.appendChild(input);
        });
      });
    </script>
    <script>
      // Page loading fade veil: reveal each page from a clean white veil, and
      // re-cover on bfcache exit so back/forward crossfades too. Marking <html>
      // now — before the veil element is parsed — disables the CSS-only fallback
      // reveal, so the JS transition and the CSS fallback never fight over opacity.
      (function () {
        document.documentElement.classList.add("page-fade-js");
        var revealed = false;
        function veil() { return document.querySelector("[data-page-fade]"); }
        function reveal() {
          if (revealed) return;
          revealed = true;
          var el = veil();
          if (el) { el.classList.remove("is-covering"); el.classList.add("is-revealed"); }
        }
        function cover() {
          revealed = false;
          var el = veil();
          if (el) { el.classList.remove("is-revealed"); el.classList.add("is-covering"); }
        }
        function scheduleReveal() { window.setTimeout(reveal, 240); }
        if (document.readyState === "complete") scheduleReveal();
        else window.addEventListener("load", scheduleReveal, { once: true });
        window.addEventListener("pageshow", function (event) { if (event.persisted) revealed = false; scheduleReveal(); });
        window.setTimeout(reveal, 1600); // hard safety cap — never trap the page behind the veil
        window.addEventListener("pagehide", cover);
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=ui-unify-20260925-9">
    {% block head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <div class="page-fade" data-page-fade aria-hidden="true"></div>
    <div class="route-progress" aria-hidden="true"><span></span></div>
    <div class="site-notice-backdrop" data-site-notice-backdrop hidden></div>
    <section
      class="site-notice"
      id="siteNotice"
      data-site-notice
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="siteNoticeTitle"
      aria-describedby="siteNoticeMessage"
    >
      <div class="site-notice-mark" data-site-notice-mark aria-hidden="true"><span>!</span></div>
      <div class="site-notice-copy">
        <span class="site-notice-kicker" data-site-notice-kicker>NOTICE</span>
        <h2 id="siteNoticeTitle" data-site-notice-title>提示</h2>
        <p id="siteNoticeMessage" data-site-notice-message></p>
      </div>
      <button class="site-notice-close" type="button" data-site-notice-close aria-label="关闭提示"><span aria-hidden="true">×</span></button>
      <button class="site-notice-confirm" type="button" data-site-notice-confirm>知道了</button>
    </section>
    <script src="{{ url_for('static', path='i18n.js') }}?v=ui-unify-20260925-9"></script>
    {% block body %}{% endblock %}
  </body>
</html>
