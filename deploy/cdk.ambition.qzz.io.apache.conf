<VirtualHost *:80>
    ServerName cdk.ambition.qzz.io

    ProxyPreserveHost On
    # This vhost is reachable only by the local Cloudflare Tunnel process, so its
    # CF-Connecting-IP header is the trusted client address used by app limits.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-For "expr=%{HTTP:CF-Connecting-IP}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    LimitRequestBody 29360128
    RequestReadTimeout body=10-120,minrate=65536

    <Location "/admin/login">
        LimitRequestBody 16384
    </Location>
    <Location "/api/redeem">
        LimitRequestBody 65536
    </Location>
    <Location "/api/convert">
        LimitRequestBody 23068672
    </Location>
    <Location "/admin/uploads">
        LimitRequestBody 28311552
    </Location>
    <Location "/admin/uploads/manual">
        LimitRequestBody 2162688
    </Location>
    <Location "/admin/liveness/upload-check">
        LimitRequestBody 28311552
    </Location>
    <Location "/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Location "/">
        Require ip 127.0.0.1 ::1
    </Location>

    ProxyPass        / http://127.0.0.1:18743/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:18743/

    ErrorLog  ${APACHE_LOG_DIR}/cdk.ambition.qzz.io-error.log
    CustomLog ${APACHE_LOG_DIR}/cdk.ambition.qzz.io-access.log combined
</VirtualHost>
