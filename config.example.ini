[database]
# SQLite is suitable for local evaluation. Use a dedicated PostgreSQL database
# in production and keep its password only in config.ini or an environment variable.
url = sqlite:///data/tikawang.db

[storage]
dir = storage

[server]
public_base_url = http://127.0.0.1:18743

[security]
session_secret = replace-with-at-least-32-random-characters
super_admin_username = owner@example.com
super_admin_password = replace-with-a-strong-super-admin-password
admin_username =
admin_password =
trust_proxy_headers = false
cookie_secure = false

[liveness]
dashboard_url = https://example.com/admin/cdk-liveness
